server:
  port: 8080

spring:
  application:
    name: corporate-wiki-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/corporate_wiki}
    username: ${DB_USER:wiki}
    password: ${DB_PASSWORD:wiki}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
