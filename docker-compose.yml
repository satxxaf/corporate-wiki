services:
  db:
    image: postgres:16
    container_name: corporate_wiki_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corporate_wiki}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wiki_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${POSTGRES_DB:-corporate_wiki}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: corporate_wiki_app
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-corporate_wiki}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-wiki_password}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET не задан}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata: