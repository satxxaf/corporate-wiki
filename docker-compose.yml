services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: corporate_wiki
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: wiki_password
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d corporate_wiki"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports: [ "8080:8080" ]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/corporate_wiki
volumes:
  pgdata: